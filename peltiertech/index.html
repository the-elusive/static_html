<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <title>PNG Image Viewer</title>
  <style>
    /* Theme tokens: light by default */
    :root {
      --file-list-max-height: 25vh; /* Initial height variable */
      --bg: #ffffff;
      --fg: #000000;
      --link: #0056b3;
      --link-hover: #003366;
      --panel-bg: #f9f9f9;
      --border: #cccccc;
      --btn-bg: #f0f0f0;
      --btn-fg: #000000;
      --btn-border: #999999;
    }
    /* Follow the OS setting unless the user has forced light */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #121212;
        --fg: #e6e6e6;
        --link: #6cb4ff;
        --link-hover: #a8d4ff;
        --panel-bg: #1e1e1e;
        --border: #444444;
        --btn-bg: #2a2a2a;
        --btn-fg: #e6e6e6;
        --btn-border: #555555;
      }
    }
    /* Forced dark via the toggle */
    :root[data-theme="dark"] {
      --bg: #121212;
      --fg: #e6e6e6;
      --link: #6cb4ff;
      --link-hover: #a8d4ff;
      --panel-bg: #1e1e1e;
      --border: #444444;
      --btn-bg: #2a2a2a;
      --btn-fg: #e6e6e6;
      --btn-border: #555555;
    }

    html {
      background-color: var(--bg);
    }
    /* Everything confined to the left two thirds of the screen:
       66.667% of the viewport width, minus the 20px margin on each side */
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      width: calc(100% * 2 / 3 - 40px);
      background-color: var(--bg);
      color: var(--fg);
    }
    a {
      color: var(--link);
      text-decoration: none;
    }
    a:hover, a:active {
      color: var(--link-hover);
      text-decoration: underline;
    }
    .source-link {
      margin: 0 0 15px;
      font-size: 14px;
      word-break: break-all;
    }
    /* Toggleable file list */
    .file-list-toggle {
      margin-bottom: 10px;
    }
    .file-list {
      border: 1px solid var(--border);
      border-bottom: none; /* Connects smoothly to the resizer bar */
      background-color: var(--panel-bg);
      padding: 10px 10px 10px 0;
      margin-bottom: 0;
      height: var(--file-list-max-height);
      max-height: 80vh;
      min-height: 60px;
      overflow: auto;
      font-size: 14px;
    }
    /* Full-width draggable handle bar at the bottom */
    .file-resizer {
      height: 6px;
      border: 1px solid var(--border);
      background-color: var(--btn-bg);
      cursor: ns-resize;
      margin-bottom: 15px;
      border-radius: 0 0 3px 3px;
      opacity: 0.8;
      transition: opacity 0.2s, background-color 0.2s;
    }
    .file-resizer:hover {
      opacity: 1;
      background-color: var(--border);
    }
    .file-list ol {
      margin: 0;
    }
    .file-list li {
      margin: 4px 0;
      overflow-wrap: anywhere;
    }
    .file-list li a {
      text-decoration: underline;
    }
    .file-list li.active-item span {
      text-decoration: underline;
    }
    .navigation {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }
    button {
      font-size: 18px;
      padding: 5px 15px;
      cursor: pointer;
      background-color: var(--btn-bg);
      color: var(--btn-fg);
      border: 1px solid var(--btn-border);
      border-radius: 3px;
    }
    button:disabled {
      opacity: 0.4;
      cursor: default;
    }
    #themeBtn {
      margin-left: auto;
      font-size: 14px;
    }
    #listToggleBtn {
      font-size: 14px;
    }
    #fileLink {
      font-weight: bold;
      font-size: 16px;
      color: var(--link);
      text-decoration: underline;
      cursor: pointer;
      min-width: 0;
      word-break: break-all;
    }
    #fileLink:hover {
      color: var(--link-hover);
    }
    .image-desc {
      margin: 0 0 15px;
      font-size: 15px;
      overflow-wrap: anywhere;
    }
    .image-container {
      text-align: center;
      border: 1px solid var(--border);
      padding: 10px;
      background-color: var(--panel-bg);
      max-height: 85vh;
      overflow: auto;
    }
    img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <p class="source-link"><a href="https://peltiertech.com/referencing-pivot-table-ranges-in-vba/" target="_blank">https://peltiertech.com/referencing-pivot-table-ranges-in-vba/</a></p>

  <!-- Toggleable file list -->
  <div class="file-list-toggle">
    <button id="listToggleBtn" onclick="toggleFileList()" aria-expanded="false" aria-controls="fileListSection">☰ Show file list</button>
  </div>
  <div id="fileListSection" class="file-list" hidden>
    <ol id="fileList"></ol>
  </div>
  <div id="fileResizer" class="file-resizer" style="display: none;" title="Drag to resize"></div>

  <div class="navigation">
    <button id="prevBtn" onclick="navigate(-1)">←</button>
    <button id="nextBtn" onclick="navigate(1)">→</button>
    <a id="fileLink" href="#" target="_blank" title="Click to open image natively in a new tab/window"></a>
    <button id="themeBtn" onclick="toggleTheme()" title="Switch between light and dark mode"></button>
  </div>

  <p id="imageDesc" class="image-desc"></p>

  <div class="image-container">
    <img id="imageView" src="" alt="Selected PNG" />
  </div>

  <script>
    // ---- Light / dark mode ----
    const darkQuery = window.matchMedia("(prefers-color-scheme: dark)");

    function isDark() {
      const forced = document.documentElement.getAttribute("data-theme");
      return forced ? forced === "dark" : darkQuery.matches;
    }

    function updateThemeButton() {
      document.getElementById("themeBtn").textContent = isDark() ? "☀ Light" : "☾ Dark";
    }

    function toggleTheme() {
      document.documentElement.setAttribute("data-theme", isDark() ? "light" : "dark");
      updateThemeButton();
    }

    darkQuery.addEventListener("change", updateThemeButton);
    updateThemeButton();

    const imageFiles = [
      { file: 'PivotTable.png',                                    desc: 'PivotTable (Overview)' },
      { file: 'PTTableRange1.png',                                 desc: 'pt.TableRange1.Select' },
      { file: 'PTTableRange2.png',                                 desc: 'pt.TableRange2.Select' },
      { file: 'PTRowRange.png',                                    desc: 'pt.RowRange.Select' },
      { file: 'PTColumnRange.png',                                 desc: 'pt.ColumnRange.Select' },
      { file: 'PTDataLabelRange.png',                              desc: 'pt.DataLabelRange.Select' },
      { file: 'PTDataBodyRange.png',                               desc: 'pt.DataBodyRange.Select' },
      { file: 'PTPageRange.png',                                   desc: 'pt.PageRange.Select' },
      { file: 'PTPFyearsLabelRange.png',                           desc: 'pt.PivotFields("Years").LabelRange.Select' },
      { file: 'PTPFyearsDataRange.png',                            desc: 'pt.PivotFields("Years").DataRange.Select' },
      { file: 'PTPFyearsPI2004LabelRange.png',                     desc: 'pt.PivotFields("Years").PivotItems("2004").LabelRange.Select' },
      { file: 'PTPFyearsPI2004DataRange.png',                      desc: 'pt.PivotFields("Years").PivotItems("2004").DataRange.Select' },
      { file: 'PTPFdatePIfebDataRange.png',                        desc: 'pt.PivotFields("Order Date").PivotItems("Feb").DataRange.Select' },
      { file: 'PTPFyearsDataRangeA.png',                           desc: 'pt.PivotFields("Years").DataRange.Select (Rows)' },
      { file: 'PTPFyearsPI2004LabelRangeA.png',                    desc: 'pt.PivotFields("Years").PivotItems("2004").LabelRange.Select (Rows)' },
      { file: 'PTPFyearsPI2004DataRangeA.png',                     desc: 'pt.PivotFields("Years").PivotItems("2004").DataRange.Select (Rows)' },
      { file: 'PTPFyrsPI2003entirerowINTPForderdatedatarange.png', desc: 'Intersect(pt.PivotFields(...), pt.PivotFields(...))' },
      { file: 'PTUnionYearsOrderDateDataRange.png',                desc: 'Union(pt.PivotFields(...), pt.PivotFields(...))' },
      { file: 'PT_DataBodyWithoutSubtotals.png',                   desc: 'pt.DataBodyRange (Without Subtotals)' },
      { file: 'PT_Next_Column.png',                                desc: 'pt.DataBodyRange.Offset(0, 1)' }
    ];

    let currentIndex = 0;
    const listItems = [];

    function buildFileList() {
      const list = document.getElementById("fileList");
      imageFiles.forEach(({ file, desc }, i) => {
        const li = document.createElement("li");
        
        const descSpan = document.createElement("span");
        descSpan.textContent = desc;
        
        const sep = document.createTextNode(": ");
        
        const a = document.createElement("a");
        a.href = encodeURIComponent(file);
        a.textContent = file;
        a.addEventListener("click", (e) => {
          e.preventDefault();
          loadImage(i);
        });

        li.appendChild(descSpan);
        li.appendChild(sep);
        li.appendChild(a);
        list.appendChild(li);

        listItems.push(li);
      });
    }

    function updateActiveListItem(index) {
      listItems.forEach((li, i) => {
        if (i === index) {
          li.classList.add("active-item");
        } else {
          li.classList.remove("active-item");
        }
      });
    }

    function toggleFileList() {
      const section = document.getElementById("fileListSection");
      const resizer = document.getElementById("fileResizer");
      const btn = document.getElementById("listToggleBtn");
      
      section.hidden = !section.hidden;
      resizer.style.display = section.hidden ? "none" : "block";
      
      btn.setAttribute("aria-expanded", String(!section.hidden));
      btn.textContent = section.hidden ? "☰ Show file list" : "☰ Hide file list";
    }

    // ---- Draggable bottom edge functionality ----
    const fileListSection = document.getElementById("fileListSection");
    const resizer = document.getElementById("fileResizer");
    let isDragging = false;
    let startY = 0;
    let startHeight = 0;

    resizer.addEventListener("mousedown", (e) => {
      isDragging = true;
      startY = e.clientY;
      startHeight = fileListSection.offsetHeight;
      document.body.style.cursor = "ns-resize";
      document.addEventListener("mousemove", onMouseMove);
      document.addEventListener("mouseup", onMouseUp);
      e.preventDefault();
    });

    function onMouseMove(e) {
      if (!isDragging) return;
      const deltaY = e.clientY - startY;
      let newHeight = startHeight + deltaY;
      if (newHeight < 60) newHeight = 60; // minimum height limit
      if (newHeight > window.innerHeight * 0.8) newHeight = window.innerHeight * 0.8; // maximum height limit
      fileListSection.style.height = newHeight + "px";
    }

    function onMouseUp() {
      isDragging = false;
      document.body.style.cursor = "";
      document.removeEventListener("mousemove", onMouseMove);
      document.removeEventListener("mouseup", onMouseUp);
    }

    // Touch support for mobile/tablets
    resizer.addEventListener("touchstart", (e) => {
      isDragging = true;
      startY = e.touches[0].clientY;
      startHeight = fileListSection.offsetHeight;
      document.addEventListener("touchmove", onTouchMove);
      document.addEventListener("touchend", onTouchEnd);
      e.preventDefault();
    });

    function onTouchMove(e) {
      if (!isDragging) return;
      const deltaY = e.touches[0].clientY - startY;
      let newHeight = startHeight + deltaY;
      if (newHeight < 60) newHeight = 60;
      if (newHeight > window.innerHeight * 0.8) newHeight = window.innerHeight * 0.8;
      fileListSection.style.height = newHeight + "px";
    }

    function onTouchEnd() {
      isDragging = false;
      document.removeEventListener("touchmove", onTouchMove);
      document.removeEventListener("touchend", onTouchEnd);
    }

    function padNumber(num, total) {
      const digits = total.toString().length;
      return num.toString().padStart(Math.max(2, digits), '0');
    }

    function loadImage(index) {
      const fileLinkElem = document.getElementById("fileLink");

      if (imageFiles.length === 0) {
        fileLinkElem.textContent = "No PNGs listed in array.";
        fileLinkElem.removeAttribute("href");
        return;
      }

      currentIndex = index;
      updateActiveListItem(currentIndex);

      const { file: currentFile, desc: currentDesc } = imageFiles[currentIndex];
      const encodedFile = encodeURIComponent(currentFile);

      const totalCount = imageFiles.length;
      const currentNumFormatted = padNumber(currentIndex + 1, totalCount);
      const totalNumFormatted = padNumber(totalCount, totalCount);

      fileLinkElem.textContent = `${currentNumFormatted} of ${totalNumFormatted}: ${currentFile}`;
      fileLinkElem.setAttribute("href", encodedFile);

      const descElem = document.getElementById("imageDesc");
      descElem.textContent = currentDesc;

      const imgElem = document.getElementById("imageView");
      imgElem.setAttribute("src", encodedFile);
      imgElem.setAttribute("alt", currentDesc);

      document.getElementById("prevBtn").disabled = (currentIndex === 0);
      document.getElementById("nextBtn").disabled = (currentIndex === imageFiles.length - 1);
    }

    function navigate(direction) {
      const newIndex = currentIndex + direction;
      if (newIndex >= 0 && newIndex < imageFiles.length) {
        loadImage(newIndex);
      }
    }

    buildFileList();
    loadImage(0);
  </script>

</body>
</html>
