<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <title>PNG Image Viewer</title>
  <style>
    /* Theme tokens: light by default */
    :root {
      --bg: #ffffff;
      --fg: #000000;
      --link: #0056b3;
      --link-hover: #003366;
      --panel-bg: #f9f9f9;
      --border: #cccccc;
      --btn-bg: #f0f0f0;
      --btn-fg: #000000;
      --btn-border: #999999;
      /* --hl-bg: #ffff00; */
      /* --hl-fg: #000000; */
    }
    /* Follow the OS setting unless the user has forced light */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #121212;
        --fg: #e6e6e6;
        --link: #6cb4ff;
        --link-hover: #a8d4ff;
        --panel-bg: #1e1e1e;
        --border: #444444;
        --btn-bg: #2a2a2a;
        --btn-fg: #e6e6e6;
        --btn-border: #555555;
        /* --hl-bg: #d4c200; */
        /* --hl-fg: #000000; */
      }
    }
    /* Forced dark via the toggle */
    :root[data-theme="dark"] {
      --bg: #121212;
      --fg: #e6e6e6;
      --link: #6cb4ff;
      --link-hover: #a8d4ff;
      --panel-bg: #1e1e1e;
      --border: #444444;
      --btn-bg: #2a2a2a;
      --btn-fg: #e6e6e6;
      --btn-border: #555555;
      /* --hl-bg: #d4c200; */
      /* --hl-fg: #000000; */
    }

    html {
      background-color: var(--bg);
    }
    /* Everything confined to the left two thirds of the screen:
       66.667% of the viewport width, minus the 20px margin on each side */
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      width: calc(100% * 2 / 3 - 40px);
      background-color: var(--bg);
      color: var(--fg);
    }
    a {
      color: var(--link);
    }
    a:hover {
      color: var(--link-hover);
    }
    .source-link {
      margin: 0 0 15px;
      font-size: 14px;
      word-break: break-all;
    }
    /* Toggleable file list */
    .file-list-toggle {
      margin-bottom: 10px;
    }
    .file-list {
      border: 1px solid var(--border);
      background-color: var(--panel-bg);
      padding: 10px 10px 10px 0;
      margin-bottom: 15px;
      max-height: 40vh;
      overflow: auto;
      font-size: 14px;
    }
    .file-list ol {
      margin: 0;
    }
    /* Descriptions wrap at word boundaries; a single over-long word
       (e.g. a filename) is still allowed to break rather than overflow */
    .file-list li {
      margin: 2px 0;
      overflow-wrap: anywhere;
    }
    .navigation {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }
    button {
      font-size: 18px;
      padding: 5px 15px;
      cursor: pointer;
      background-color: var(--btn-bg);
      color: var(--btn-fg);
      border: 1px solid var(--btn-border);
      border-radius: 3px;
    }
    button:disabled {
      opacity: 0.4;
      cursor: default;
    }
    #themeBtn {
      margin-left: auto;
      font-size: 14px;
    }
    #listToggleBtn {
      font-size: 14px;
    }
    #fileLink {
      font-weight: bold;
      font-size: 16px;
      color: var(--link);
      text-decoration: underline;
      cursor: pointer;
      min-width: 0;
      word-break: break-all;
    }
    #fileLink:hover {
      color: var(--link-hover);
    }
    /* Highlight style for specific sections of the file name (disabled) */
    /*
    .highlight {
      background-color: var(--hl-bg);
      color: var(--hl-fg);
      padding: 0 3px;
      border-radius: 2px;
    }
    */
    .image-desc {
      margin: 0 0 15px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }
    .image-container {
      text-align: center;
      border: 1px solid var(--border);
      padding: 10px;
      background-color: var(--panel-bg);
      max-height: 85vh;
      overflow: auto;
    }
    img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <p class="source-link"><a href="https://peltiertech.com/referencing-pivot-table-ranges-in-vba/" target="_blank">https://peltiertech.com/referencing-pivot-table-ranges-in-vba/</a></p>

  <!-- Toggleable file list -->
  <div class="file-list-toggle">
    <button id="listToggleBtn" onclick="toggleFileList()" aria-expanded="false" aria-controls="fileListSection">☰ Show file list</button>
  </div>
  <div id="fileListSection" class="file-list" hidden>
    <ol id="fileList"></ol>
  </div>

  <div class="navigation">
    <button id="prevBtn" onclick="navigate(-1)">←</button>
    <button id="nextBtn" onclick="navigate(1)">→</button>
    <a id="fileLink" href="#" target="_blank" title="Click to open image natively in a new tab/window"></a>
    <button id="themeBtn" onclick="toggleTheme()" title="Switch between light and dark mode"></button>
  </div>

  <p id="imageDesc" class="image-desc"></p>

  <div class="image-container">
    <img id="imageView" src="" alt="Selected PNG" />
  </div>

  <script>
    // ---- Light / dark mode ----
    // Starts from the OS setting; the button overrides it for this page view.
    const darkQuery = window.matchMedia("(prefers-color-scheme: dark)");

    function isDark() {
      const forced = document.documentElement.getAttribute("data-theme");
      return forced ? forced === "dark" : darkQuery.matches;
    }

    function updateThemeButton() {
      document.getElementById("themeBtn").textContent = isDark() ? "☀ Light" : "☾ Dark";
    }

    function toggleTheme() {
      document.documentElement.setAttribute("data-theme", isDark() ? "light" : "dark");
      updateThemeButton();
    }

    darkQuery.addEventListener("change", updateThemeButton);
    updateThemeButton();

    // 1. Image filenames from PNGs.txt, each with its own description
    const imageFiles = [
      { file: 'PivotTable.png',                                    desc: 'Dummy desc' },
      { file: 'PTTableRange1.png',                                 desc: 'pt.TableRange1.Select' },
      { file: 'PTTableRange2.png',                                 desc: 'pt.TableRange2.Select' },
      { file: 'PTRowRange.png',                                    desc: 'pt.RowRange.Select' },
      { file: 'PTColumnRange.png',                                 desc: 'pt.ColumnRange.Select' },
      // { file: 'PTCX4_gold_280x233.png',                         desc: 'Dummy desc' },
      // { file: 'PTCX5_660x82.png',                               desc: 'Dummy desc' },
      // { file: 'PTCX5_728x90.png',                               desc: 'Dummy desc' },
      { file: 'PTDataBodyRange.png',                               desc: 'Dummy desc' },
      { file: 'PTDataLabelRange.png',                              desc: 'Dummy desc' },
      { file: 'PTPageRange.png',                                   desc: 'Dummy desc' },
      { file: 'PTPFdatePIfebDataRange.png',                        desc: 'Dummy desc' },
      { file: 'PTPFyearsDataRange.png',                            desc: 'Dummy desc' },
      { file: 'PTPFyearsDataRangeA.png',                           desc: 'Dummy desc' },
      { file: 'PTPFyearsLabelRange.png',                           desc: 'Dummy desc' },
      { file: 'PTPFyearsPI2004DataRange.png',                      desc: 'Dummy desc' },
      { file: 'PTPFyearsPI2004DataRangeA.png',                     desc: 'Dummy desc' },
      { file: 'PTPFyearsPI2004LabelRange.png',                     desc: 'Dummy desc' },
      { file: 'PTPFyearsPI2004LabelRangeA.png',                    desc: 'pt.PivotFields("Years").PivotItems("2004").LabelRange.Select' },
      { file: 'PTPFyrsPI2003entirerowINTPForderdatedatarange.png', desc: 'Dummy desc' },
      { file: 'PTUnionYearsOrderDateDataRange.png',                desc: 'Dummy desc' },
      { file: 'PT_DataBodyWithoutSubtotals.png',                   desc: 'Dummy desc' },
      { file: 'PT_Next_Column.png',                                desc: 'Dummy desc' }
    ];

    let currentIndex = 0;

    // ---- Toggleable file list ----
    // Each link loads its image into the viewer instead of navigating away.
    function buildFileList() {
      const list = document.getElementById("fileList");
      imageFiles.forEach(({ file, desc }, i) => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = encodeURIComponent(file);
        a.textContent = file;
        a.addEventListener("click", (e) => {
          e.preventDefault();
          loadImage(i);
        });
        // Plain-text description first, then the clickable filename
        li.appendChild(document.createTextNode(`${desc}: `));
        li.appendChild(a);
        list.appendChild(li);
      });
    }

    function toggleFileList() {
      const section = document.getElementById("fileListSection");
      const btn = document.getElementById("listToggleBtn");
      section.hidden = !section.hidden;
      btn.setAttribute("aria-expanded", String(!section.hidden));
      btn.textContent = section.hidden ? "☰ Show file list" : "☰ Hide file list";
    }

    // Helper to pad numbers with leading zeros
    function padNumber(num, total) {
      const digits = total.toString().length;
      return num.toString().padStart(Math.max(2, digits), '0');
    }

    function loadImage(index) {
      const fileLinkElem = document.getElementById("fileLink");

      if (imageFiles.length === 0) {
        fileLinkElem.textContent = "No PNGs listed in array.";
        fileLinkElem.removeAttribute("href");
        return;
      }

      currentIndex = index;
      const { file: currentFile, desc: currentDesc } = imageFiles[currentIndex];
      const encodedFile = encodeURIComponent(currentFile);

      // Format counter string: "03 of 23"
      const totalCount = imageFiles.length;
      const currentNumFormatted = padNumber(currentIndex + 1, totalCount);
      const totalNumFormatted = padNumber(totalCount, totalCount);
      const counterText = `${currentNumFormatted} of ${totalNumFormatted}`;

      // Highlight dimensions, ID numbers, or specific modifiers if present in the filename (disabled)
      // const highlightedFile = currentFile.replace(
      //   /(_\d+x\d+|_gold|\d{4})/g,
      //   '<span class="highlight">$1</span>'
      // );
      // fileLinkElem.innerHTML = `${counterText}: ${highlightedFile}`;

      // Render updated text (no highlighting) and destination link
      fileLinkElem.textContent = `${counterText}: ${currentFile}`;
      fileLinkElem.setAttribute("href", encodedFile);

      // Show this image's description
      document.getElementById("imageDesc").textContent = currentDesc;

      // Update image source (description doubles as alt text)
      const imgElem = document.getElementById("imageView");
      imgElem.setAttribute("src", encodedFile);
      imgElem.setAttribute("alt", currentDesc);

      // Disable buttons at boundaries
      document.getElementById("prevBtn").disabled = (currentIndex === 0);
      document.getElementById("nextBtn").disabled = (currentIndex === imageFiles.length - 1);
    }

    function navigate(direction) {
      const newIndex = currentIndex + direction;
      if (newIndex >= 0 && newIndex < imageFiles.length) {
        loadImage(newIndex);
      }
    }

    // Build the file list and load initial image on page launch
    buildFileList();
    loadImage(0);
  </script>

</body>
</html>
